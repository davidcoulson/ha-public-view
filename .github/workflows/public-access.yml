name: Public Access

on:
  push:
    paths: ['public-access/**', '.github/workflows/public-access.yml']
  pull_request:
    paths: ['public-access/**', '.github/workflows/public-access.yml']

defaults:
  run:
    working-directory: public-access

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: public-access/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the add-on image for both architectures
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg BUILD_FROM=node:26-alpine .

  e2e:
    # Runs the real thing: Home Assistant in Docker, the app, then the visitor-side tests.
    runs-on: ubuntu-latest
    needs: unit
    env:
      HA_URL: http://localhost:8123
      PA_ADMIN_USER: admin
      PA_ADMIN_PASS: admin-dev-password
      PA_OPTIONS_FILE: ${{ github.workspace }}/public-access/dev/options.json
      DATA_DIR: ${{ runner.temp }}/pa-data
      UI_PORT: '8100'
      PA_UI_ALLOW_ANY: '1'
      PA_ADDON_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: public-access/package-lock.json
      - run: npm ci
      - name: Start Home Assistant
        run: |
          docker run -d --name ha --network host -v "$PWD/dev/ha-config:/config" ghcr.io/home-assistant/home-assistant:stable
          for i in $(seq 1 120); do curl -sf http://localhost:8123/manifest.json >/dev/null && break; sleep 3; done
          curl -sf http://localhost:8123/manifest.json >/dev/null
      - name: Seed the test dashboard
        run: node dev/seed.ts
      - name: Start the app
        run: |
          node src/main.ts > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8099/healthz >/dev/null && break; sleep 2; done
          curl -sf http://localhost:8099/healthz >/dev/null
      - run: node test/e2e/run.ts
      - name: Add the ESPHome device to Home Assistant
        run: |
          curl -sf -X POST http://localhost:8100/api/esphome/adopt
          sleep 10
      - run: node test/e2e/esphome.ts
      - run: npx playwright-core install --with-deps chromium
      - run: node test/e2e/browser.ts
      - name: Show logs on failure
        if: failure()
        run: |
          echo '--- app'; cat "$RUNNER_TEMP/app.log" || true
          echo '--- home assistant'; docker logs ha 2>&1 | tail -80 || true
