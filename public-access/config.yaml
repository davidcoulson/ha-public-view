name: Public Access
version: "0.1.0"
slug: public_access
description: Share one dashboard view publicly, read-only, with no login
url: https://github.com/davidcoulson/ha-public-view/tree/main/public-access
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
homeassistant_api: true   # setup page talks to Core through the Supervisor; the public side never does
hassio_api: true          # to read this add-on's own host name for the Cloudflared snippet
ingress: true
ingress_port: 8100
panel_icon: mdi:eye-lock
panel_title: Public Access
panel_admin: true
ports:
  8099/tcp: null          # public listener; stays on the internal network unless you map a host port
ports_description:
  8099/tcp: Public page (only needed without the Cloudflared add-on)
options:
  ha_url: http://homeassistant:8123
  log_level: info
  publications: []
schema:
  ha_url: url
  log_level: list(debug|info|warn|error)
  max_sessions: int(1,500)?
  max_sessions_per_visitor: int(1,50)?
  publications:
    - hostname: str
      dashboard: str
      view: str
      title: str?
      noindex: bool?
